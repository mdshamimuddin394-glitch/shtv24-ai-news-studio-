<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHTV24 - AI News Studio</title>
<style>
body{font-family:system-ui;margin:0;background:#0f172a;color:#fff;text-align:center}
header{padding:30px;background:linear-gradient(135deg,#0ea5e9,#7c3aed)}
.card{background:#1e293b;margin:20px;padding:20px;border-radius:15px}
textarea{width:90%;height:100px;padding:10px;border-radius:10px}
button{padding:12px 20px;background:#0ea5e9;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:10px}
#output{margin-top:15px;background:#0f172a;padding:15px;border-radius:10px;text-align:left;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h1>SHTV24 AI News Studio</h1>
<p>AI Powered Bangla & English News</p>
</header>
<div class="card">
<h2>Create News Script</h2>
<textarea id="newsInput">ব্রেকিং নিউজ: সিলেটে আজ প্রযুক্তি মেলা শুরু হয়েছে।</textarea><br>
<select id="lang"><option value="bn">Bangla</option><option value="en">English</option></select><br>
<button onclick="generate()">Generate Script</button>
<div id="output">Output will appear here...</div>
</div>
<div class="card">
<p>© 2026 SHTV24 | Built by Md Shamim Uddin - Mulvibazar | MIT License</p>
<a href="https://paypal.me/shtv24" style="color:#ffc439">Donate via PayPal</a>
</div>
<script>
{ function generate(){
let t=document.getElementById('newsInput').value;
let l=document.getElementById('lang').value;
let o=document.getElementById('output');
if(!t){o.innerText='আগে খবর লিখুন ভাই!';return;}
let d={'Today':'আজ','Bangladesh':'বাংলাদেশ','News':'খবর','Prime Minister':'প্রধানমন্ত্রী','President':'রাষ্ট্রপতি','Port':'বন্দর','Sylhet':'সিলেট','Dhaka':'ঢাকা','Mongla':'মোংলা','Economy':'অর্থনীতি','Test':'টেস্ট'};
for(let k in d){t=t.split(k).join(d[k]);}
if(l=='bn'){o.innerText='[BANGLA ANCHOR]\n\nআসসালামু আলাইকুম, SHTV24 এ স্বাগতম।\n\nআজকের প্রধান খবর:\n\n'+t+'\n\nচোখ রাখুন SHTV24 এ।';}
else{o.innerText='[ENGLISH ANCHOR]\n\nWelcome to SHTV24.\n\n'+t+'\n\nStay tuned.';}
}
